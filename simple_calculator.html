<html>
<head>
    <title>Simple Calculator </title>
</head>
<body>

    <h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder="enter first number">
<input type="number" id="num2" placeholder="enter second number">

<p>
    <button onclick="addNumbers()">+</button>
    <button onclick="subtractNumbers()">-</button>
    <button onclick="multiplyNumbers()">x</button>
    <button onclick="divideNumbers()">/</button>
</p>

 <p id="result">Result</p>   

 <script>
    function addNumbers(){
        const value1 = document.getElementById("num1").value; 
        const value2 = document.getElementById("num2").value;
        const num1 = Number(value1);
        const num2 = Number(value2);
        const result = num1 + num2;
        document.getElementById("result").innerText = "Result:" + result;
      }
    function subtractNumbers(){
        const value1 = document.getElementById("num1").value;
        const value2 = document.getElementById("num2").value;
        const num1 = Number(value1);
        const num2 = Number(value2);
        document.getElementById("result").innerText = "Result:" + (num1 - num2); 
    }
    function multiplyNumbers(){
        const value1 = document.getElementById("num1").value;
        const value2 = document.getElementById("num2").value;
        const num1 = Number(value1);
        const num2 = Number(value2);
        document.getElementById("result").innerText = "Result:" + (num1 * num2); 
    }
    function divideNumbers(){
        const value1 = document.getElementById("num1").value;
        const value2 = document.getElementById("num2").value;
        const num1 = Number(value1);
        const num2 = Number(value2);
        
        if (num2 === 0){
            document.getElementById("result").innerText = "Cannot be divided by zero!";
            return;
        }
        document.getElementById("result").innerText = "Result" + (num1/num2);
    }
</script>
</body>
</html>
